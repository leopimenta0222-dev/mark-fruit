<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <!-- Fundo branco -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="640" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Sistema Mark Fruit — Casos de Uso</text>
  <text x="640" y="66" text-anchor="middle" font-size="13" fill="#57534e" font-style="italic">Diagrama UML — atores e funcionalidades</text>

  <!-- Caixa do sistema -->
  <rect x="290" y="110" width="950" height="640" fill="#fafaf9" stroke="#a8a29e" stroke-width="2" rx="10"/>
  <text x="765" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#44403c">Sistema Mark Fruit</text>

  <!-- ============ CONEXOES (antes dos atores/UCs pra ficar atras) ============ -->
  <g stroke="#a8a29e" stroke-width="1" fill="none">
    <!-- Visitante -> publicos -->
    <line x1="138" y1="218" x2="382" y2="195"/>
    <line x1="138" y1="218" x2="622" y2="195"/>
    <line x1="138" y1="218" x2="838" y2="195"/>
    <line x1="138" y1="228" x2="477" y2="290"/>
    <line x1="138" y1="228" x2="717" y2="290"/>

    <!-- Consumidor -> Avaliar produto -->
    <line x1="138" y1="430" x2="372" y2="415"/>
    <!-- Consumidor -> Sair / Perfil / Conversar -->
    <line x1="138" y1="445" x2="402" y2="525"/>
    <line x1="138" y1="445" x2="597" y2="525"/>
    <line x1="138" y1="445" x2="862" y2="525"/>

    <!-- Produtor -> Sair / Perfil / Conversar -->
    <line x1="138" y1="650" x2="402" y2="525"/>
    <line x1="138" y1="650" x2="597" y2="525"/>
    <line x1="138" y1="650" x2="862" y2="525"/>
    <!-- Produtor -> Criar / Editar / Excluir -->
    <line x1="138" y1="650" x2="382" y2="635"/>
    <line x1="138" y1="650" x2="612" y2="635"/>
    <line x1="138" y1="650" x2="852" y2="635"/>
  </g>

  <!-- ============ HERANCA DE ATORES (arvore esquerda) ============ -->
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="55" y1="320" x2="55" y2="635"/>
    <line x1="55" y1="415" x2="103" y2="415"/>
    <line x1="55" y1="635" x2="103" y2="635"/>
  </g>
  <polygon points="55,300 47,320 63,320" fill="white" stroke="#1c1917" stroke-width="1.5"/>
  <text x="76" y="350" font-size="10" fill="#78716c" font-style="italic">herda</text>

  <!-- ============ ATORES ============ -->
  <!-- Visitante -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <circle cx="120" cy="195" r="14" fill="white"/>
    <line x1="120" y1="209" x2="120" y2="250"/>
    <line x1="100" y1="223" x2="140" y2="223"/>
    <line x1="120" y1="250" x2="103" y2="275"/>
    <line x1="120" y1="250" x2="137" y2="275"/>
  </g>
  <text x="120" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">Visitante</text>

  <!-- Consumidor -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <circle cx="120" cy="415" r="14" fill="white"/>
    <line x1="120" y1="429" x2="120" y2="470"/>
    <line x1="100" y1="443" x2="140" y2="443"/>
    <line x1="120" y1="470" x2="103" y2="495"/>
    <line x1="120" y1="470" x2="137" y2="495"/>
  </g>
  <text x="120" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Consumidor</text>

  <!-- Produtor -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <circle cx="120" cy="635" r="14" fill="white"/>
    <line x1="120" y1="649" x2="120" y2="690"/>
    <line x1="100" y1="663" x2="140" y2="663"/>
    <line x1="120" y1="690" x2="103" y2="715"/>
    <line x1="120" y1="690" x2="137" y2="715"/>
  </g>
  <text x="120" y="738" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Produtor</text>

  <!-- ============ CASOS DE USO ============ -->
  <!-- Linha 1: publicos -->
  <ellipse cx="472" cy="195" rx="90" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="472" y="200" text-anchor="middle" font-size="13" fill="#14532d">Cadastrar-se</text>

  <ellipse cx="702" cy="195" rx="80" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="702" y="200" text-anchor="middle" font-size="13" fill="#14532d">Fazer login</text>

  <ellipse cx="938" cy="195" rx="100" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="938" y="200" text-anchor="middle" font-size="13" fill="#14532d">Pesquisar produtos</text>

  <!-- Linha 2: publicos -->
  <ellipse cx="582" cy="290" rx="105" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="582" y="295" text-anchor="middle" font-size="13" fill="#14532d">Visualizar anúncio</text>

  <ellipse cx="822" cy="290" rx="105" ry="33" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="822" y="287" text-anchor="middle" font-size="13" fill="#14532d">Consultar bot</text>
  <text x="822" y="304" text-anchor="middle" font-size="11" fill="#14532d" font-style="italic">"Como Plantar"</text>

  <!-- Linha 3: Consumidor exclusivo -->
  <ellipse cx="472" cy="415" rx="100" ry="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="472" y="420" text-anchor="middle" font-size="13" fill="#1e3a8a">Avaliar produto</text>

  <!-- Linha 4: Compartilhados -->
  <ellipse cx="472" cy="525" rx="70" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="472" y="530" text-anchor="middle" font-size="13" fill="#713f12">Sair</text>

  <ellipse cx="702" cy="525" rx="105" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="702" y="530" text-anchor="middle" font-size="13" fill="#713f12">Gerenciar perfil</text>

  <ellipse cx="938" cy="525" rx="80" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="938" y="530" text-anchor="middle" font-size="13" fill="#713f12">Conversar</text>

  <!-- Linha 5: Produtor exclusivo -->
  <ellipse cx="472" cy="635" rx="90" ry="28" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="472" y="640" text-anchor="middle" font-size="13" fill="#831843">Criar anúncio</text>

  <ellipse cx="702" cy="635" rx="90" ry="28" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="702" y="640" text-anchor="middle" font-size="13" fill="#831843">Editar anúncio</text>

  <ellipse cx="938" cy="635" rx="90" ry="28" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="938" y="640" text-anchor="middle" font-size="13" fill="#831843">Excluir anúncio</text>

  <!-- ============ LEGENDA ============ -->
  <g transform="translate(40, 795)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#44403c">Legenda:</text>
    <rect x="85" y="-11" width="14" height="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="105" y="0" font-size="12" fill="#44403c">Acesso público (Visitante)</text>
    <rect x="305" y="-11" width="14" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="325" y="0" font-size="12" fill="#44403c">Exclusivo do Consumidor</text>
    <rect x="510" y="-11" width="14" height="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="530" y="0" font-size="12" fill="#44403c">Comum aos dois logados</text>
    <rect x="715" y="-11" width="14" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="735" y="0" font-size="12" fill="#44403c">Exclusivo do Produtor</text>
  </g>

  <!-- Rodape -->
  <text x="1240" y="830" text-anchor="end" font-size="10" fill="#a8a29e" font-style="italic">Mark Fruit · TCC · Maria, Maria, Luiza e Yago</text>
</svg>
