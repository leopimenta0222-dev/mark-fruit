# Blueprint do Render — cria o backend + banco PostgreSQL automaticamente.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: markfruit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markfruit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # você preenche depois com a URL do Vercel

databases:
  - name: markfruit-db
    plan: free
